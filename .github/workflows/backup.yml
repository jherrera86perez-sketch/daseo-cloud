name: Backup diario de la BD

on:
  schedule:
    # 08:00 UTC = madrugada en Brasil/Cuba
    - cron: "0 8 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: pg_dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: |
          # Neon corre PG 18: agregar repo PGDG e instalar cliente 18
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-18
          pg_dump "$DATABASE_URL" -Fc -f "daseo-$(date +%F).dump"
          ls -lh *.dump

      - name: Guardar artifact (30 días)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: "*.dump"
          retention-days: 30
