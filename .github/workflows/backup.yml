name: Backup diario de la BD

on:
  schedule:
    # 08:00 UTC = madrugada en Brasil/Cuba
    - cron: "0 8 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: pg_dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          pg_dump "$DATABASE_URL" -Fc -f "daseo-$(date +%F).dump"
          ls -lh *.dump

      - name: Guardar artifact (30 días)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: "*.dump"
          retention-days: 30
